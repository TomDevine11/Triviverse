# REFERENCE COPY. This must live at .github/workflows/ci.yml to run. It is kept here
# because the current OAuth token lacks GitHub `workflow` scope and cannot push files
# under .github/workflows/. Add it via the GitHub UI or a workflow-scoped token.
name: CI
# Server-side quality gate for the autonomous model: lint + tests (incl. the
# architecture layer guard) + full build (vite + prerender) must pass before any
# PR merges. Node 22.12.0 matches render.yaml (production runtime).
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      # Lint is ADVISORY for now: the repo has ~24 pre-existing lint errors (mostly
      # react-hooks/set-state-in-effect). Backlog B-010 drives it to zero, then this
      # flips to a hard gate (remove continue-on-error).
      - name: Lint (advisory)
        run: npm run lint
        continue-on-error: true
      - name: Test (vitest + architecture layer guard)
        run: npm test
      - name: Build (vite + prerender)
        run: npm run build
