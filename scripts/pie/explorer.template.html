<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PIE · 501 Candidate Explorer</title>
<style>
  :root{--bg:#0e0f15;--panel:#161822;--ink:#e8eaf2;--muted:#9aa0b4;--faint:#666d84;--line:#262a38;--line2:#1d2030;--brand:#9d8cf5;--good:#3cc9a0;--bad:#e06a55;--warn:#e0a94e;--code:#12141d}
  @media(prefers-color-scheme:light){:root{--bg:#f3f4f8;--panel:#fff;--ink:#171820;--muted:#5a6072;--faint:#8b91a4;--line:#e3e5ee;--line2:#eef0f6;--brand:#6d5ae0;--good:#0e9c78;--bad:#c8492f;--warn:#b7791b;--code:#f5f5fb}}
  *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums}
  .mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
  .app{display:grid;grid-template-columns:270px 1fr;min-height:100vh}
  @media(max-width:760px){.app{grid-template-columns:1fr}}
  aside{background:var(--panel);border-right:1px solid var(--line);padding:16px;position:sticky;top:0;height:100vh;overflow-y:auto}
  aside h1{font-size:15px;margin:0 0 2px} aside .sub{font-size:12px;color:var(--faint);margin-bottom:14px}
  .wt{margin:11px 0} .wt label{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:3px}
  .wt label b{color:var(--ink)} .wt input[type=range]{width:100%;accent-color:var(--brand)}
  .filters{margin:14px 0;display:flex;flex-direction:column;gap:6px;font-size:12.5px}
  .filters label{display:flex;gap:7px;align-items:center;color:var(--muted);cursor:pointer}
  main{padding:16px 18px;overflow-x:hidden}
  .head{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px;margin-bottom:12px}
  .head h2{font-size:17px;margin:0} .head .stat{font-size:12.5px;color:var(--faint)}
  .row{background:var(--panel);border:1px solid var(--line);border-radius:9px;margin-bottom:6px;overflow:hidden}
  .row.fail{opacity:.5}
  .rhead{display:grid;grid-template-columns:38px 54px 1fr auto;gap:10px;align-items:center;padding:9px 12px;cursor:pointer}
  .rank{color:var(--faint);font-size:12px;text-align:right}
  .score{font-weight:800;font-size:15px} .score.ok{color:var(--good)} .score.no{color:var(--bad)}
  .ttl{font-weight:600;font-size:13.5px} .ttl .cur{background:var(--brand);color:#fff;font-size:9.5px;font-weight:800;letter-spacing:.04em;padding:1px 6px;border-radius:5px;margin-right:6px;vertical-align:1px}
  .mini{display:flex;gap:9px;font-size:11px;color:var(--muted);white-space:nowrap}
  .mini b{color:var(--ink)} .g-ok{color:var(--good)} .g-no{color:var(--bad)}
  .body{display:none;border-top:1px solid var(--line2);padding:12px 14px;background:var(--code)}
  .row.open .body{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media(max-width:680px){.row.open .body{grid-template-columns:1fr}}
  .sec h4{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--faint);margin:0 0 6px}
  table{width:100%;border-collapse:collapse;font-size:12px} td{padding:2px 4px;border-bottom:1px solid var(--line2)}
  td.n{text-align:right;font-variant-numeric:tabular-nums}
  .bar{height:5px;background:var(--line);border-radius:3px;overflow:hidden;display:inline-block;width:60px;vertical-align:middle}
  .bar>i{display:block;height:100%;background:var(--brand)}
  .lb td:first-child{color:var(--muted)} .lb .fame{color:var(--faint);font-size:10.5px}
  .expl{font-size:12.5px} .expl .s{color:var(--good)} .expl .w{color:var(--warn)} .expl .p{color:var(--bad)} .expl div{margin:2px 0}
  .pill{font-size:10px;font-weight:700;padding:1px 6px;border-radius:5px} .pill.p{background:color-mix(in srgb,var(--good) 20%,transparent);color:var(--good)} .pill.f{background:color-mix(in srgb,var(--bad) 20%,transparent);color:var(--bad)}
</style></head>
<body>
<div class="app">
  <aside>
    <h1>501 Candidate Explorer</h1>
    <div class="sub" id="meta"></div>
    <div style="font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);margin-bottom:4px">Weights — drag to re-rank live</div>
    <div id="weights"></div>
    <div class="filters">
      <div style="font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)">Show</div>
      <label><input type="radio" name="filt" value="all" checked>All candidates</label>
      <label><input type="radio" name="filt" value="pass">Only passing gates</label>
      <label><input type="radio" name="filt" value="curated">Only my curated questions</label>
    </div>
    <button id="reset" style="margin-top:8px;font-size:12px;background:var(--line);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:5px 10px;cursor:pointer">Reset weights</button>
  </aside>
  <main>
    <div class="head"><h2 id="clubh"></h2><div class="stat" id="counts"></div></div>
    <div id="list"></div>
  </main>
</div>
<script>
const DATA = /*__DATA__*/;
const DEFAULT_W = JSON.parse(JSON.stringify(DATA.config.WEIGHTS));
let W = JSON.parse(JSON.stringify(DATA.config.WEIGHTS));
const GATES = DATA.config.GATES;

// —— identical to rank.mjs ——
function normVal(spec,x){const[t,a,b,c]=spec;
  if(t==='band'){if(x<=a||x>=c)return 0;return x<b?(x-a)/(b-a):(c-x)/(c-b)}
  if(t==='lower'){if(x<=a)return 1;if(x>=b)return 0;return(b-x)/(b-a)}
  if(t==='higher'){return Math.max(0,Math.min(1,x/a))}
  if(t==='bool')return x?1:0;return 0}
function scoreOf(p){let s=0,w=0;const bd={};for(const m in W){const raw=p[m];const nv=normVal(W[m].norm,raw);bd[m]={raw,norm:+nv.toFixed(3),weight:W[m].weight,contribution:+(nv*W[m].weight).toFixed(3)};s+=nv*W[m].weight;w+=W[m].weight}return{score:w?s/w:0,bd}}
function gatesFailed(p){const f=[];for(const k in GATES){const g=GATES[k];const v=p[g.metric];const ok=g.op==='gte'?v>=g.value:g.op==='lte'?v<=g.value:!!v;if(!ok)f.push({gate:k,metric:g.metric,value:v,need:g.op==='true'?'must be true':g.op+' '+g.value})}return f}

const $=(s)=>document.querySelector(s);
document.getElementById('meta').textContent = DATA.candidates.length+' candidates · compiled '+DATA.generatedAt.slice(0,10);
document.getElementById('clubh').textContent = DATA.club;

// weight sliders
const wc=$('#weights');
for(const m in W){const d=document.createElement('div');d.className='wt';
  d.innerHTML=`<label>${m}<b class="mono" data-v="${m}">${W[m].weight.toFixed(1)}</b></label><input type="range" min="0" max="4" step="0.1" value="${W[m].weight}" data-m="${m}">`;wc.appendChild(d);}
wc.addEventListener('input',e=>{const m=e.target.dataset.m;if(!m)return;W[m].weight=+e.target.value;wc.querySelector(`[data-v="${m}"]`).textContent=(+e.target.value).toFixed(1);render();});
$('#reset').onclick=()=>{W=JSON.parse(JSON.stringify(DEFAULT_W));wc.querySelectorAll('input').forEach(i=>{i.value=W[i.dataset.m].weight;wc.querySelector(`[data-v="${i.dataset.m}"]`).textContent=W[i.dataset.m].weight.toFixed(1)});render();};
document.querySelectorAll('[name=filt]').forEach(r=>r.onchange=render);
const filt=()=>document.querySelector('[name=filt]:checked').value;

const fmtG=(p)=>{const f=gatesFailed(p);return f.length?`<span class="g-no">✗ ${f.length}</span>`:`<span class="g-ok">✓</span>`};

function render(){
  const items=DATA.candidates.map(c=>{const{score,bd}=scoreOf(c.profile);const gf=gatesFailed(c.profile);return{c,score,bd,gf}});
  items.sort((a,b)=>b.score-a.score);
  const f=filt();
  const show=items.filter(x=> f==='pass'?x.gf.length===0 : f==='curated'?x.c.curated : true);
  const passN=items.filter(x=>x.gf.length===0).length, curN=items.filter(x=>x.c.curated).length;
  $('#counts').innerHTML=`${passN}/${items.length} pass gates · ${curN} curated`;
  const html=show.map((x,i)=>{const c=x.c,p=c.profile,pass=x.gf.length===0;
    const mini=`<span>pool <b>${p.poolSize}</b></span><span>rec <b>${p.recognisableCount}</b></span><span>dom <b>${p.dominance}</b></span><span>routes <b>${p.checkoutRoutes}</b></span><span>known-ck ${p.checkoutWithKnown?'<b class=g-ok>y</b>':'<b class=g-no>n</b>'}</span>`;
    const prof=Object.entries(x.bd).map(([m,b])=>`<tr><td>${m}</td><td class=n>${b.raw}</td><td class=n><span class=bar><i style="width:${Math.round(b.norm*100)}%"></i></span></td><td class=n>${b.norm.toFixed(2)}×${b.weight}</td></tr>`).join('');
    const extra=['maxValue','medianValue','valueVariance','recognisableShare','completeness','coverage','checkoutFeasible'].map(k=>`<tr><td>${k}</td><td class=n colspan=3>${p[k]}</td></tr>`).join('');
    const lb=c.board.map(b=>`<tr><td>${b.n}</td><td class=n>${b.v}</td><td class="n fame">f${b.f}</td></tr>`).join('');
    const expl=`${x.gf.length?`<div class=p>${x.gf.map(g=>`GATE ${g.gate}: ${g.metric}=${g.value} (${g.need})`).join('<br>')}</div>`:''}
      <div class=s>▲ ${c.explanation.strengths.join(', ')||'—'}</div>
      <div class=w>▼ ${c.explanation.weaknesses.join(', ')||'—'}</div>`;
    return `<div class="row ${pass?'':'fail'}" data-i="${i}">
      <div class="rhead"><span class="rank">${i+1}</span><span class="score ${pass?'ok':'no'}">${x.score.toFixed(2)}</span>
        <span class="ttl">${c.curated?'<span class=cur>CURATED</span>':''}${c.title}</span>
        <span class="mini">${mini} ${fmtG(p)}</span></div>
      <div class="body">
        <div class="sec"><h4>Metric profile · ${pass?'<span class="pill p">PASSED</span>':'<span class="pill f">FAILED GATES</span>'}</h4>
          <table>${prof}${extra}</table><div class="expl" style="margin-top:8px">${expl}</div></div>
        <div class="sec"><h4>Leaderboard (top 30 of ${p.poolSize})</h4><table class="lb">${lb}</table></div>
      </div></div>`;
  }).join('');
  $('#list').innerHTML=html||'<div style="color:var(--faint);padding:20px">No candidates match this filter.</div>';
}
$('#list').addEventListener('click',e=>{const r=e.target.closest('.row');if(r)r.classList.toggle('open')});
render();
</script>
</body></html>
