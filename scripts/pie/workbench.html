<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PIE · Calibration Workbench</title>
<style>
  :root{--bg:#0d0e14;--panel:#161822;--p2:#1b1e2a;--ink:#e8eaf2;--muted:#99a0b4;--faint:#646b82;--line:#262a38;--brand:#9d8cf5;--good:#3cc9a0;--bad:#e06a55;--warn:#e0a94e;--code:#12141d}
  @media(prefers-color-scheme:light){:root{--bg:#f2f3f7;--panel:#fff;--p2:#f6f7fb;--ink:#171820;--muted:#586074;--faint:#8b91a4;--line:#e4e6ef;--brand:#6d5ae0;--good:#0e9c78;--bad:#c8492f;--warn:#b7791b;--code:#f4f4fb}}
  *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums}
  .mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
  header{display:flex;align-items:center;gap:16px;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:5}
  header h1{font-size:15px;margin:0} header .count{font-size:12.5px;color:var(--faint);margin-left:auto}
  nav{display:flex;gap:4px}
  nav button{background:none;border:1px solid transparent;color:var(--muted);font:600 13px system-ui;padding:6px 12px;border-radius:7px;cursor:pointer}
  nav button.on{background:var(--p2);color:var(--ink);border-color:var(--line)}
  main{max-width:960px;margin:0 auto;padding:22px 18px}
  .tab{display:none} .tab.on{display:block}
  h2{font-size:16px;margin:0 0 12px}
  .cards{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:640px){.cards{grid-template-columns:1fr}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px}
  .card .q{font-size:16px;font-weight:700;line-height:1.3;min-height:44px}
  .card .filt{font-size:12px;color:var(--faint);margin:8px 0 12px}
  .card .ans{font-size:13px;color:var(--muted)} .card .ans b{color:var(--ink);font-weight:600}
  .pickbtn{width:100%;margin-top:14px;background:var(--brand);color:#fff;border:none;border-radius:9px;padding:11px;font:700 14px system-ui;cursor:pointer}
  .pickbtn:hover{filter:brightness(1.08)}
  .controls{display:flex;justify-content:center;gap:10px;margin-top:16px}
  .controls button{background:var(--p2);border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:8px 16px;font:600 13px system-ui;cursor:pointer}
  .hint{text-align:center;color:var(--faint);font-size:12px;margin-top:10px}
  table{width:100%;border-collapse:collapse;font-size:13px;margin:6px 0 16px} th,td{text-align:left;padding:7px 9px;border-bottom:1px solid var(--line)} th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--faint)}
  td.n{text-align:right}
  .bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;min-width:70px;display:inline-block;vertical-align:middle} .bar>i{display:block;height:100%}
  .pos{color:var(--good)}.neg{color:var(--bad)}
  .box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
  .box h3{margin:0 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--faint)}
  .empty{color:var(--faint);text-align:center;padding:30px}
  .wgrid{display:grid;grid-template-columns:1fr auto auto;gap:6px 14px;align-items:center;font-size:13px}
  .wgrid .k{color:var(--muted)} .wgrid .old{color:var(--faint)} .wgrid .new{font-weight:700}
  pre{background:var(--code);border:1px solid var(--line);border-radius:9px;padding:12px;overflow-x:auto;font-size:12px}
  button.act{background:var(--brand);color:#fff;border:none;border-radius:8px;padding:9px 16px;font:600 13px system-ui;cursor:pointer}
  .kbd{font:11px ui-monospace;background:var(--p2);border:1px solid var(--line);border-radius:4px;padding:1px 5px;color:var(--muted)}
  .tag{font-size:10px;font-weight:700;padding:1px 6px;border-radius:5px;background:var(--p2);color:var(--muted)}
</style></head>
<body>
<header>
  <h1>PIE · Calibration Workbench</h1>
  <nav id="nav">
    <button data-t="compare" class="on">Compare</button>
    <button data-t="analysis">Analysis</button>
    <button data-t="corr">Correlation</button>
    <button data-t="sim">Weight simulator</button>
  </nav>
  <span class="count" id="count">…</span>
</header>
<main>
  <section class="tab on" id="t-compare">
    <h2>Which would you rather play?</h2>
    <div class="cards" id="pair"></div>
    <div class="controls">
      <button onclick="vote('a')">← Left wins</button>
      <button onclick="vote('skip')">Skip</button>
      <button onclick="vote('b')">Right wins →</button>
    </div>
    <div class="hint">Scores are hidden on purpose. <span class="kbd">←</span> left · <span class="kbd">→</span> right · <span class="kbd">space</span> skip</div>
  </section>

  <section class="tab" id="t-analysis"><h2>Disagreement analysis</h2><div id="analysis"></div></section>
  <section class="tab" id="t-corr"><h2>Metric correlation with your choices</h2><div id="corr"></div></section>
  <section class="tab" id="t-sim"><h2>Weight simulator</h2><div id="sim"></div></section>
</main>
<script>
const $=s=>document.querySelector(s), api=(p,o)=>fetch(p,o).then(r=>r.json());
let POOL=[], BYID={}, PREFS=[], CFG=null, W={}, curA=null, curB=null;
const WEIGHT_KEYS=()=>Object.keys(W);
const METRIC_KEYS=()=>Object.keys(POOL[0]?.profile||{}).filter(k=>typeof POOL[0].profile[k]==='number');

// —— scoring (identical maths to rank.mjs) ——
function normVal(spec,x){const[t,a,b,c]=spec;
  if(t==='band'){if(x<=a||x>=c)return 0;return x<b?(x-a)/(b-a):(c-x)/(c-b)}
  if(t==='lower'){if(x<=a)return 1;if(x>=b)return 0;return(b-x)/(b-a)}
  if(t==='higher')return Math.max(0,Math.min(1,x/a));if(t==='bool')return x?1:0;return 0}
function score(p,w=W){let s=0,ws=0;for(const m in w){s+=normVal(w[m].norm,p[m])*w[m].weight;ws+=w[m].weight}return ws?s/ws:0}
const predict=(pa,pb,w=W)=>score(pa,w)-score(pb,w);              // >0 ⇒ engine prefers A
const conf=(d)=>1/(1+Math.exp(-8*d));                            // score gap → probability

// —— init ——
(async()=>{
  const pool=await api('/pool'); if(pool.error){document.body.innerHTML='<main><p style="padding:40px">Run <code>node scripts/pie/pool.mjs</code> first.</p></main>';return}
  POOL=pool.candidates; POOL.forEach(c=>BYID[c.id]=c);
  CFG=await api('/config'); W=JSON.parse(JSON.stringify(CFG.WEIGHTS));
  PREFS=await api('/preferences');
  document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>tab(b.dataset.t));
  updateCount(); nextPair();
  document.addEventListener('keydown',e=>{if($('#t-compare').classList.contains('on')){if(e.key==='ArrowLeft')vote('a');else if(e.key==='ArrowRight')vote('b');else if(e.key===' '){e.preventDefault();vote('skip')}}});
})();
function updateCount(){const d=PREFS.filter(p=>p.winner!=='skip').length;$('#count').textContent=`${d} decisions · ${PREFS.length} shown`}
function tab(t){document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));document.querySelectorAll('.tab').forEach(s=>s.classList.remove('on'));$('#t-'+t).classList.add('on');if(t==='analysis')renderAnalysis();if(t==='corr')renderCorr();if(t==='sim')renderSim()}

// —— P1 pairwise ——
const DIMS=['seed','stat','populationType','competition','europe','decade','position','hasPosition','hasNationality'];
function nextPair(){
  const a=POOL[Math.floor(Math.random()*POOL.length)];
  let b;
  if(Math.random()<0.55){ // axis-isolated: differ on exactly one dimension
    const axis=DIMS[Math.floor(Math.random()*DIMS.length)];
    const cands=POOL.filter(c=>c.id!==a.id && c.dimensions[axis]!==a.dimensions[axis] && DIMS.filter(d=>d!==axis).every(d=>c.dimensions[d]===a.dimensions[d]));
    b=cands.length?cands[Math.floor(Math.random()*cands.length)]:null;
  }
  if(!b){do{b=POOL[Math.floor(Math.random()*POOL.length)]}while(b.id===a.id)}
  curA=a;curB=b;renderPair();
}
function card(c){const pop=c.population;const filt=[pop.competition, c.projection.statLabel, pop.club||'', pop.position||'', pop.nationality?('nat '+pop.nationality):''].filter(Boolean).join(' · ');
  const ans=c.board.slice(0,6).map(b=>b.n).join(', ');
  return `<div class="card"><div class="q">${c.title}</div><div class="filt">${filt}</div><div class="ans">Answers include:<br><b>${ans}</b></div></div>`}
function renderPair(){$('#pair').innerHTML=card(curA)+card(curB)}
async function vote(winner){
  if(!curA||!curB)return;
  const v={a:curA.id,b:curB.id,winner,compilerVersion:CFG?'':'',titleA:curA.title,titleB:curB.title,profileA:curA.profile,profileB:curB.profile,dimsA:curA.dimensions,dimsB:curB.dimensions};
  const r=await api('/vote',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(v)});
  PREFS.push({...v,ts:Date.now()});updateCount();nextPair();
}

// —— helpers over decided prefs ——
const decided=()=>PREFS.filter(p=>p.winner!=='skip'&&p.profileA&&p.profileB);
const winnerProfile=p=>p.winner==='a'?p.profileA:p.profileB, loserProfile=p=>p.winner==='a'?p.profileB:p.profileA;

// —— P3 + P6 analysis ——
function renderAnalysis(){
  const D=decided(); const el=$('#analysis');
  if(D.length<8){el.innerHTML=`<div class="empty">Collect ~8+ decisions to unlock analysis. (${D.length} so far)</div>`;return}
  // dimension win-rates: winner's value +1, loser's value −1, only when they differ on that dim
  let html='';
  html+=`<div class="box"><h3>Preference by dimension — where the choice differs on one axis</h3>`;
  for(const d of DIMS){
    const tally={};
    for(const p of D){const wv=(p.winner==='a'?p.dimsA:p.dimsB)[d], lv=(p.winner==='a'?p.dimsB:p.dimsA)[d]; if(wv===lv)continue;
      (tally[wv]=tally[wv]||{w:0,l:0}).w++; (tally[lv]=tally[lv]||{w:0,l:0}).l++;}
    const rows=Object.entries(tally).filter(([,t])=>t.w+t.l>=3).sort((a,b)=>(b[1].w/(b[1].w+b[1].l))-(a[1].w/(a[1].w+a[1].l)));
    if(!rows.length)continue;
    html+=`<div style="margin:8px 0 2px;font-weight:600">${d}</div><table>`;
    for(const [val,t] of rows){const n=t.w+t.l,r=t.w/n;html+=`<tr><td>${val}</td><td class="n">${(r*100).toFixed(0)}% preferred</td><td class="n" style="width:120px"><span class="bar"><i style="width:${(r*100).toFixed(0)}%;background:${r>=.5?'var(--good)':'var(--bad)'}"></i></span></td><td class="n" style="color:var(--faint)">n=${n}</td></tr>`}
    html+='</table>';
  }
  html+='</div>';
  // engine vs human extremes
  const ranked=D.map(p=>({p,gap:score(winnerProfile(p))-score(loserProfile(p))}));
  const surprises=ranked.filter(x=>x.gap<-0.02).sort((a,b)=>a.gap-b.gap).slice(0,8); // you picked the lower-engine-scored one
  html+=`<div class="box"><h3>Biggest disagreements — you chose the option the engine scored LOWER</h3>`;
  html+= surprises.length? `<table><tr><th>You chose</th><th>Over</th><th class="n">engine gap</th></tr>`+surprises.map(x=>{const wp=x.p.winner==='a'?x.p.titleA:x.p.titleB,lp=x.p.winner==='a'?x.p.titleB:x.p.titleA;return `<tr><td>${wp}</td><td style="color:var(--faint)">${lp}</td><td class="n neg">${x.gap.toFixed(2)}</td></tr>`}).join('')+'</table>' : '<div class="empty">None yet — the engine agrees with you so far.</div>';
  html+='</div>';
  // P6 mispredictions with reasons
  const mis=D.map(p=>{const d=predict(p.profileA,p.profileB);const pred=d>0?'a':'b';return{p,d,pred,wrong:pred!==p.winner}}).filter(x=>x.wrong).sort((a,b)=>Math.abs(b.d)-Math.abs(a.d)).slice(0,8);
  html+=`<div class="box"><h3>Mispredictions — why the engine was confident and wrong</h3>`;
  if(!mis.length)html+='<div class="empty">No confident mispredictions yet.</div>';
  for(const x of mis){const p=x.p;const engPick=x.pred==='a'?p.titleA:p.titleB, human=p.winner==='a'?p.titleA:p.titleB;
    // top contributing metric diffs that pushed the engine toward its (wrong) pick
    const contrib=WEIGHT_KEYS().map(m=>{const a=normVal(W[m].norm,p.profileA[m]),b=normVal(W[m].norm,p.profileB[m]);return{m,diff:(a-b)*W[m].weight}}).sort((u,v)=>Math.abs(v.diff)-Math.abs(u.diff));
    const towards=contrib.filter(c=>(c.diff>0)===(x.pred==='a')).slice(0,3);
    html+=`<div style="border-top:1px solid var(--line);padding:8px 0"><div>Engine: <b>${engPick}</b> (${(conf(Math.abs(x.d))*100).toFixed(0)}% conf) · You: <b class="pos">${human}</b></div><div style="font-size:12px;color:var(--muted);margin-top:2px">drove the wrong call: ${towards.map(c=>c.m+' ('+(c.diff>0?'+':'')+c.diff.toFixed(2)+')').join(', ')}</div></div>`}
  html+='</div>';
  el.innerHTML=html;
}

// —— P4 correlation ——
function pearson(xs,ys){const n=xs.length;if(n<2)return 0;const mx=xs.reduce((a,b)=>a+b,0)/n,my=ys.reduce((a,b)=>a+b,0)/n;let sxy=0,sx=0,sy=0;for(let i=0;i<n;i++){const dx=xs[i]-mx,dy=ys[i]-my;sxy+=dx*dy;sx+=dx*dx;sy+=dy*dy}return(sx&&sy)?sxy/Math.sqrt(sx*sy):0}
function renderCorr(){
  const D=decided(); const el=$('#corr');
  if(D.length<10){el.innerHTML=`<div class="empty">Collect ~10+ decisions to compute correlations. (${D.length} so far)</div>`;return}
  const rows=METRIC_KEYS().map(m=>{
    const xs=[],ys=[];let agree=0,dis=0;
    for(const p of D){if(p.profileA[m]==null||p.profileB[m]==null)continue; // metric didn't exist when this vote was cast
      const dv=(+p.profileA[m])-(+p.profileB[m]);const y=p.winner==='a'?1:0;xs.push(dv);ys.push(y);
      if(dv!==0){const metricSaysA=dv>0;if(metricSaysA===(y===1))agree++;else dis++}}
    return{m,r:pearson(xs,ys),n:agree+dis,agree,dis};
  }).sort((a,b)=>Math.abs(b.r)-Math.abs(a.r));
  const acc=accuracyAt(W,D);
  el.innerHTML=`<div class="box"><h3>How well each metric's raw difference predicts your winner (Pearson r)</h3>
    <table><tr><th>Metric</th><th class="n">r</th><th></th><th class="n">agrees / disagrees</th></tr>`+
    rows.map(x=>{const w=Math.abs(x.r)*100;return `<tr><td>${x.m}</td><td class="n ${x.r>=0?'pos':'neg'}">${x.r.toFixed(2)}</td><td style="width:130px"><span class="bar"><i style="width:${w.toFixed(0)}%;background:${x.r>=0?'var(--good)':'var(--bad)'}"></i></span></td><td class="n" style="color:var(--faint)">${x.agree} / ${x.dis}</td></tr>`}).join('')+
    `</table><div style="font-size:12px;color:var(--muted);margin-top:8px">Positive r ⇒ higher values predict you pick it · near-zero ⇒ the metric predicts nothing · currently-weighted metrics are the scored ones. Current weights predict <b>${(acc*100).toFixed(0)}%</b> of your decisions.</div></div>`;
}

// —— P5 weight simulator (simple hill-climb — no ML) ——
function accuracyAt(w,D){let ok=0,n=0;for(const p of D){const d=predict(p.profileA,p.profileB,w);if(d===0)continue;n++;if((d>0?'a':'b')===p.winner)ok++}return n?ok/n:0}
function optimise(D){
  let w=JSON.parse(JSON.stringify(W)),best=accuracyAt(w,D),step=0.4;
  for(let pass=0;pass<40;pass++){let improved=false;
    for(const m of WEIGHT_KEYS()){for(const dir of[1,-1]){const cand=JSON.parse(JSON.stringify(w));cand[m].weight=Math.max(0,+(cand[m].weight+dir*step).toFixed(2));const a=accuracyAt(cand,D);if(a>best+1e-9){w=cand;best=a;improved=true}}}
    if(!improved){if(step<=0.05)break;step/=2}}
  return{w,acc:best};
}
function renderSim(){
  const D=decided(); const el=$('#sim');
  if(D.length<15){el.innerHTML=`<div class="empty">Collect ~15+ decisions before optimising weights. (${D.length} so far)</div>`;return}
  const cur=accuracyAt(W,D);
  el.innerHTML=`<div class="box"><h3>Optimise weights against your preferences</h3>
    <p style="color:var(--muted)">Simple coordinate hill-climb (no ML). Finds weights that best predict your ${D.length} decisions. <b>Recommendation only</b> — nothing is applied automatically; copy into <span class="mono">config.mjs</span> if you agree.</p>
    <div>Current weights predict <b>${(cur*100).toFixed(0)}%</b>.</div>
    <button class="act" style="margin-top:10px" onclick="runOpt()">Optimise →</button>
    <div id="optout" style="margin-top:14px"></div></div>`;
}
window.runOpt=()=>{const D=decided();const{w,acc}=optimise(D);
  const rows=WEIGHT_KEYS().map(m=>`<span class="k">${m}</span><span class="old">${W[m].weight.toFixed(2)}</span><span class="new ${w[m].weight>W[m].weight?'pos':w[m].weight<W[m].weight?'neg':''}">→ ${w[m].weight.toFixed(2)}</span>`).join('');
  const cfg='export const WEIGHTS = {\n'+WEIGHT_KEYS().map(m=>`  ${m}: { weight: ${w[m].weight}, norm: ${JSON.stringify(W[m].norm)} },`).join('\n')+'\n}';
  $('#optout').innerHTML=`<div>Optimised weights predict <b class="pos">${(acc*100).toFixed(0)}%</b> of your decisions.</div>
    <div class="wgrid" style="margin:10px 0">${rows}</div>
    <div style="font-size:12px;color:var(--faint);margin-bottom:4px">Paste into config.mjs:</div><pre>${cfg}</pre>`;
};
</script>
</body></html>
