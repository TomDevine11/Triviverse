<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PIE · Calibration Workbench</title>
<style>
  :root{--bg:#0d0e14;--panel:#161822;--p2:#1b1e2a;--ink:#e8eaf2;--muted:#99a0b4;--faint:#646b82;--line:#262a38;--brand:#9d8cf5;--good:#3cc9a0;--bad:#e06a55;--warn:#e0a94e;--code:#12141d}
  @media(prefers-color-scheme:light){:root{--bg:#f3f4f8;--panel:#fff;--p2:#f6f7fb;--ink:#171820;--muted:#586074;--faint:#8b91a4;--line:#e4e6ef;--brand:#6d5ae0;--good:#0e9c78;--bad:#c8492f;--warn:#b7791b;--code:#f4f4fb}}
  *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums}
  .mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
  header{display:flex;align-items:center;gap:16px;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:5}
  header h1{font-size:15px;margin:0} header .count{font-size:12.5px;color:var(--faint);margin-left:auto}
  nav{display:flex;gap:4px}
  nav button{background:none;border:1px solid transparent;color:var(--muted);font:600 13px system-ui;padding:6px 12px;border-radius:7px;cursor:pointer}
  nav button.on{background:var(--p2);color:var(--ink);border-color:var(--line)}
  main{max-width:940px;margin:0 auto;padding:22px 18px}
  .tab{display:none} .tab.on{display:block}
  h2{font-size:16px;margin:0 0 14px}
  /* rate card */
  .rc{max-width:560px;margin:0 auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:26px}
  .rc .q{font-size:22px;font-weight:750;line-height:1.25}
  .rc .filt{font-size:12.5px;color:var(--faint);margin:10px 0 16px}
  .rc .ans{font-size:14px;color:var(--muted)} .rc .ans b{color:var(--ink);font-weight:600}
  .rbtns{display:flex;gap:10px;max-width:560px;margin:16px auto 0}
  .rbtns button{flex:1;border:1px solid var(--line);border-radius:11px;padding:14px;font:700 15px system-ui;cursor:pointer;background:var(--p2);color:var(--ink)}
  .rbtns .yes{background:var(--good);color:#fff;border-color:transparent}
  .rbtns .no{background:var(--bad);color:#fff;border-color:transparent}
  .rbtns .skip{flex:0 0 90px;color:var(--muted)}
  .hint{text-align:center;color:var(--faint);font-size:12px;margin-top:12px}
  .kbd{font:11px ui-monospace;background:var(--p2);border:1px solid var(--line);border-radius:4px;padding:1px 5px;color:var(--muted)}
  table{width:100%;border-collapse:collapse;font-size:13px;margin:6px 0 16px} th,td{text-align:left;padding:7px 9px;border-bottom:1px solid var(--line)} th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--faint)}
  td.n{text-align:right}
  .bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;min-width:70px;display:inline-block;vertical-align:middle} .bar>i{display:block;height:100%}
  .pos{color:var(--good)}.neg{color:var(--bad)}
  .box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
  .box h3{margin:0 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--faint)}
  .empty{color:var(--faint);text-align:center;padding:30px}
  .wgrid{display:grid;grid-template-columns:1fr auto auto;gap:6px 14px;align-items:center;font-size:13px}
  .wgrid .k{color:var(--muted)} .wgrid .old{color:var(--faint)} .wgrid .new{font-weight:700}
  pre{background:var(--code);border:1px solid var(--line);border-radius:9px;padding:12px;overflow-x:auto;font-size:12px}
  button.act{background:var(--brand);color:#fff;border:none;border-radius:8px;padding:9px 16px;font:600 13px system-ui;cursor:pointer}
</style></head>
<body>
<header>
  <h1>PIE · Calibration Workbench</h1>
  <nav id="nav">
    <button data-t="rate" class="on">Rate</button>
    <button data-t="analysis">Analysis</button>
    <button data-t="corr">Correlation</button>
    <button data-t="sim">Weight simulator</button>
  </nav>
  <span class="count" id="count">…</span>
</header>
<main>
  <section class="tab on" id="t-rate">
    <h2>Would you be happy to see this as the daily?</h2>
    <div class="rc" id="card"></div>
    <div class="rbtns">
      <button class="no" onclick="rate('no')">👎 No</button>
      <button class="skip" onclick="rate('skip')">Skip</button>
      <button class="yes" onclick="rate('yes')">👍 Yes</button>
    </div>
    <div class="hint"><span class="kbd">n</span> no · <span class="kbd">y</span> yes · <span class="kbd">space</span> skip</div>
  </section>
  <section class="tab" id="t-analysis"><h2>What you say yes to</h2><div id="analysis"></div></section>
  <section class="tab" id="t-corr"><h2>Which metrics predict "yes"</h2><div id="corr"></div></section>
  <section class="tab" id="t-sim"><h2>Weight simulator</h2><div id="sim"></div></section>
</main>
<script>
const $=s=>document.querySelector(s), api=(p,o)=>fetch(p,o).then(r=>r.json());
let POOL=[], BYID={}, PREFS=[], CFG=null, W={}, cur=null;
const WEIGHT_KEYS=()=>Object.keys(W);
const METRIC_KEYS=()=>Object.keys(POOL[0]?.profile||{}).filter(k=>typeof POOL[0].profile[k]==='number');
const DIMS=['seed','stat','populationType','competition','europe','decade','position','nationality','club','anchor','hasPosition','hasNationality'];

// scoring (identical to rank.mjs)
function normVal(spec,x){const[t,a,b,c]=spec;
  if(t==='band'){if(x<=a||x>=c)return 0;return x<b?(x-a)/(b-a):(c-x)/(c-b)}
  if(t==='lower'){if(x<=a)return 1;if(x>=b)return 0;return(b-x)/(b-a)}
  if(t==='higher')return Math.max(0,Math.min(1,x/a));if(t==='bool')return x?1:0;return 0}
function score(p,w=W){let s=0,ws=0;for(const m in w){if(p[m]==null)continue;s+=normVal(w[m].norm,p[m])*w[m].weight;ws+=w[m].weight}return ws?s/ws:0}

(async()=>{
  const pool=await api('/pool'); if(pool.error){document.body.innerHTML='<main><p style="padding:40px">Run <code>node scripts/pie/pool.mjs</code> first.</p></main>';return}
  POOL=pool.candidates; POOL.forEach(c=>BYID[c.id]=c);
  CFG=await api('/config'); W=JSON.parse(JSON.stringify(CFG.WEIGHTS));
  PREFS=await api('/preferences');
  document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>tab(b.dataset.t));
  updateCount(); nextCard();
  document.addEventListener('keydown',e=>{if($('#t-rate').classList.contains('on')){if(e.key==='y')rate('yes');else if(e.key==='n')rate('no');else if(e.key===' '){e.preventDefault();rate('skip')}}});
})();
const rated=()=>PREFS.filter(p=>p.kind==='rate'&&p.verdict!=='skip'&&p.profile);
function updateCount(){const r=rated();const y=r.filter(p=>p.verdict==='yes').length;$('#count').textContent=`${r.length} rated · ${y} yes / ${r.length-y} no`}
function tab(t){document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));document.querySelectorAll('.tab').forEach(s=>s.classList.remove('on'));$('#t-'+t).classList.add('on');if(t==='analysis')renderAnalysis();if(t==='corr')renderCorr();if(t==='sim')renderSim()}

// —— Rate: single candidate, prefer unrated ——
function nextCard(){
  const done=new Set(PREFS.filter(p=>p.kind==='rate').map(p=>p.candidate));
  const fresh=POOL.filter(c=>!done.has(c.id));
  const src=fresh.length?fresh:POOL;
  cur=src[Math.floor(Math.random()*src.length)];
  renderCard();
}
function renderCard(){const c=cur,pop=c.population;
  const filt=[pop.competition,c.projection.statLabel,pop.club||'',pop.position||'',pop.decade||'',pop.nationality?('nat '+pop.nationality):''].filter(Boolean).join(' · ');
  $('#card').innerHTML=`<div class="q">${c.title}</div><div class="filt">${filt}</div><div class="ans">Answers include:<br><b>${c.board.slice(0,7).map(b=>b.n).join(', ')}</b></div>`;
}
async function rate(verdict){
  if(!cur)return;
  const v={kind:'rate',candidate:cur.id,verdict,title:cur.title,profile:cur.profile,dimensions:cur.dimensions};
  await api('/vote',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(v)});
  PREFS.push({...v,ts:Date.now()});updateCount();nextCard();
}

// —— P3 Analysis: yes-rate by dimension + disagreements ——
function renderAnalysis(){
  const R=rated(); const el=$('#analysis');
  if(R.length<10){el.innerHTML=`<div class="empty">Rate ~10+ questions to unlock analysis. (${R.length} so far)</div>`;return}
  let html=`<div class="box"><h3>Yes-rate by dimension — what you like, dislike, and lean toward</h3>`;
  const blocks=[];
  for(const d of DIMS){
    const t={};
    for(const p of R){const v=p.dimensions[d];if(v==null)continue;(t[v]=t[v]||{y:0,n:0})[p.verdict==='yes'?'y':'n']++}
    const rows=Object.entries(t).filter(([,x])=>x.y+x.n>=3).map(([v,x])=>({v,r:x.y/(x.y+x.n),n:x.y+x.n})).sort((a,b)=>b.r-a.r);
    if(rows.length<1)continue;
    blocks.push(`<div style="margin:8px 0 2px;font-weight:600">${d}</div><table>`+rows.map(x=>`<tr><td>${x.v}</td><td class="n">${(x.r*100).toFixed(0)}% yes</td><td class="n" style="width:120px"><span class="bar"><i style="width:${(x.r*100).toFixed(0)}%;background:${x.r>=.5?'var(--good)':'var(--bad)'}"></i></span></td><td class="n" style="color:var(--faint)">n=${x.n}</td></tr>`).join('')+'</table>');
  }
  html+=blocks.join('')+'</div>';
  // disagreements vs current score
  const scored=R.map(p=>({p,s:score(p.profile)}));
  const rejHigh=scored.filter(x=>x.p.verdict==='no').sort((a,b)=>b.s-a.s).slice(0,6);
  const accLow=scored.filter(x=>x.p.verdict==='yes').sort((a,b)=>a.s-b.s).slice(0,6);
  html+=`<div class="box"><h3>You said NO but the engine scored high</h3>${rejHigh.length?'<table>'+rejHigh.map(x=>`<tr><td>${x.p.title}</td><td class="n">score ${x.s.toFixed(2)}</td></tr>`).join('')+'</table>':'<div class="empty">—</div>'}</div>`;
  html+=`<div class="box"><h3>You said YES but the engine scored low</h3>${accLow.length?'<table>'+accLow.map(x=>`<tr><td>${x.p.title}</td><td class="n">score ${x.s.toFixed(2)}</td></tr>`).join('')+'</table>':'<div class="empty">—</div>'}</div>`;
  el.innerHTML=html;
}

// —— P4 Correlation: point-biserial r of each metric with "yes" ——
function pearson(xs,ys){const n=xs.length;if(n<2)return 0;const mx=xs.reduce((a,b)=>a+b,0)/n,my=ys.reduce((a,b)=>a+b,0)/n;let sxy=0,sx=0,sy=0;for(let i=0;i<n;i++){const dx=xs[i]-mx,dy=ys[i]-my;sxy+=dx*dy;sx+=dx*dx;sy+=dy*dy}return(sx&&sy)?sxy/Math.sqrt(sx*sy):0}
function renderCorr(){
  const R=rated(); const el=$('#corr');
  if(R.length<12){el.innerHTML=`<div class="empty">Rate ~12+ questions to compute correlations. (${R.length} so far)</div>`;return}
  const rows=METRIC_KEYS().map(m=>{const xs=[],ys=[];for(const p of R){if(p.profile[m]==null)continue;xs.push(+p.profile[m]);ys.push(p.verdict==='yes'?1:0)}return{m,r:pearson(xs,ys),n:xs.length}}).filter(x=>x.n>=12).sort((a,b)=>Math.abs(b.r)-Math.abs(a.r));
  const acc=bestAcc(W,R).acc;
  el.innerHTML=`<div class="box"><h3>Correlation of each metric with your "yes" (point-biserial r)</h3>
    <table><tr><th>Metric</th><th class="n">r</th><th></th></tr>`+
    rows.map(x=>{const w=Math.abs(x.r)*100;return `<tr><td>${x.m}${WEIGHT_KEYS().includes(x.m)?'':' <span style="color:var(--faint)">(measured, unweighted)</span>'}</td><td class="n ${x.r>=0?'pos':'neg'}">${x.r.toFixed(2)}</td><td style="width:150px"><span class="bar"><i style="width:${w.toFixed(0)}%;background:${x.r>=0?'var(--good)':'var(--bad)'}"></i></span></td></tr>`}).join('')+
    `</table><div style="font-size:12px;color:var(--muted);margin-top:8px">Positive ⇒ higher values make you more likely to say yes. Current weights classify your yes/no at <b>${(acc*100).toFixed(0)}%</b> (best threshold).</div></div>`;
}

// —— P5 Simulator: weights + threshold that best classify yes/no (hill-climb, no ML) ——
function bestAcc(w,R){ // for given weights, pick the threshold that best separates yes/no
  const items=R.map(p=>({s:score(p.profile,w),y:p.verdict==='yes'})).sort((a,b)=>a.s-b.s);
  let best=0,thr=0; const ths=[...items.map(i=>i.s),1.01];
  for(const t of ths){let ok=0;for(const it of items)ok+=((it.s>=t)===it.y)?1:0;if(ok>best){best=ok;thr=t}}
  return{acc:best/items.length,thr};
}
function optimise(R){let w=JSON.parse(JSON.stringify(W)),best=bestAcc(w,R).acc,step=0.4;
  for(let pass=0;pass<50;pass++){let imp=false;
    for(const m of WEIGHT_KEYS())for(const d of[1,-1]){const c=JSON.parse(JSON.stringify(w));c[m].weight=Math.max(0,+(c[m].weight+d*step).toFixed(2));const a=bestAcc(c,R).acc;if(a>best+1e-9){w=c;best=a;imp=true}}
    if(!imp){if(step<=0.05)break;step/=2}}
  return{w,acc:best};
}
function renderSim(){
  const R=rated(); const el=$('#sim');
  if(R.length<20){el.innerHTML=`<div class="empty">Rate ~20+ questions before optimising weights. (${R.length} so far)</div>`;return}
  el.innerHTML=`<div class="box"><h3>Optimise weights to predict your yes/no</h3>
    <p style="color:var(--muted)">Simple hill-climb (no ML) over your ${R.length} ratings, picking the score threshold that best separates yes from no. <b>Recommendation only.</b></p>
    <div>Current weights classify <b>${(bestAcc(W,R).acc*100).toFixed(0)}%</b> correctly.</div>
    <button class="act" style="margin-top:10px" onclick="runOpt()">Optimise →</button><div id="optout" style="margin-top:14px"></div></div>`;
}
window.runOpt=()=>{const R=rated();const{w,acc}=optimise(R);
  const rows=WEIGHT_KEYS().map(m=>`<span class="k">${m}</span><span class="old">${W[m].weight.toFixed(2)}</span><span class="new ${w[m].weight>W[m].weight?'pos':w[m].weight<W[m].weight?'neg':''}">→ ${w[m].weight.toFixed(2)}</span>`).join('');
  const cfg='export const WEIGHTS = {\n'+WEIGHT_KEYS().map(m=>`  ${m}: { weight: ${w[m].weight}, norm: ${JSON.stringify(W[m].norm)} },`).join('\n')+'\n}';
  $('#optout').innerHTML=`<div>Optimised weights classify <b class="pos">${(acc*100).toFixed(0)}%</b> correctly.</div><div class="wgrid" style="margin:10px 0">${rows}</div><div style="font-size:12px;color:var(--faint);margin-bottom:4px">Paste into config.mjs:</div><pre>${cfg}</pre>`;
};
</script>
</body></html>
