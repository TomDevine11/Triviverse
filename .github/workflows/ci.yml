  name: CI
  on:
    pull_request:
    push:
      branches: [main]
    workflow_dispatch:
  concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true
  jobs:
    gate:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v4
        - uses: actions/setup-node@v4
          with:
            node-version: 22.12.0
            cache: npm
        - run: npm ci
        - name: Lint (advisory)
          run: npm run lint
          continue-on-error: true
        - name: Test
          run: npm test
        - name: Build
          run: npm run build
        # Post-build SEO validation against dist/. Catches the programmatic-SEO
        # failure modes unit tests cannot see: broken internal links, duplicate
        # titles/descriptions, sitemap<->canonical mismatch, invalid JSON-LD and
        # accidental noindex. The script was written to gate CI and exits non-zero
        # on any hard failure; it simply was never wired in. Local only, no network.
        - name: SEO validation
          run: npm run seo-validate
