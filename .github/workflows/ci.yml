  name: CI
  # Server-side quality gate: lint (advisory) + tests + full build must pass 
  before any PR
  # merges. Node 22.12.0 matches render.yaml (production runtime).
  on:
    pull_request:
    push:
      branches: [main]
    workflow_dispatch:

  concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

  jobs:
    gate:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v4
        - uses: actions/setup-node@v4
          with:
            node-version: 22.12.0
            cache: npm
        - run: npm ci
        - name: Lint (advisory)
          run: npm run lint
          continue-on-error: true
        - name: Test (vitest + architecture layer guard)
          run: npm test
        - name: Build (vite + prerender)
          run: npm run build
