name: Review guard
# Classifies every PR as user-facing or internal and records it. It no longer
# blocks: Tom decided on 2026-09-13 that Claude may merge anything passing the
# quality gate, so approval is not required for any path.
#
# The classification is kept deliberately. Knowing which merges changed what
# players see is what makes the shipped digest and any later "when did this
# regress?" question answerable — losing the interruption should not mean losing
# the record. `gate` remains the hard requirement; nothing merges on red tests.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  pull_request_review:
    types: [submitted, dismissed]
permissions:
  contents: read
  pull-requests: write
  statuses: write
jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - name: Classify the change and post commit status
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          OWNER: TomDevine11
        run: |
          files=$(gh pr diff "$PR" --repo "$REPO" --name-only)
          # Paths whose changes a visitor can perceive. src/dev and src/ads are
          # excluded: the QA overlay is inert for players, and the ad slots render
          # nothing until a real publisher id is configured.
          userfacing='^(src/(?!dev/|ads/)|public/|index\.html|og-service/|scripts/prerender\.mjs)'
          # -P only: GNU grep rejects -P with -E ("conflicting matchers specified"),
          # and -q hides that, so the combination silently classified everything as
          # internal. BSD grep on macOS tolerates it, which is why it passed locally.
          if echo "$files" | grep -qP "$userfacing"; then
            label="user-facing"
            desc="user-facing — merged without review by standing policy"
          else
            label="internal"
            desc="internal"
          fi

          # Record it on the PR so the classification survives in the history.
          gh pr edit "$PR" --repo "$REPO" --add-label "$label" 2>/dev/null || true

          echo "guard: $label ($desc)"
          gh api -X POST "repos/$REPO/statuses/$SHA" \
            -f state=success -f context=guard -f description="$desc" >/dev/null
